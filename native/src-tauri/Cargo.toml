[package]
name = "plurapack-app"
version = "0.1.0"
description = "Plurapack dashboard app"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "plurapack_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
