[package]
name = "tauri-plugin-voice-player"
version = "0.1.0"
description = "Plays Plurapack voice clips from a lasting Android media notification"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
# `links` lets tauri-build find this plugin's permissions and Android library.
links = "tauri-plugin-voice-player"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
