<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plurapack dashboard</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app" class="shell" hidden><aside class="sidebar"><button id="systemButton" class="system-button" aria-label="Open System Information"><span id="systemAvatar" class="avatar">✦</span><strong id="systemName">System</strong><span>System information</span></button><button id="addMember" class="primary">➕ Add member</button><label class="search">Find a member<input id="memberSearch" type="search"></label><nav id="memberList" class="member-list" aria-label="Members"></nav><div class="sidebar-section"><div class="sidebar-heading"><strong>GROUPS</strong><button id="addGroup">➕ New group</button></div><nav id="groupList" class="group-list" aria-label="Groups"></nav></div><section class="voice-control"><button id="voiceEnable">Enable voice playback</button><small id="voiceStatus" role="status">Browser playback waits for your permission.</small></section><button id="logout">Log out</button></aside><main id="content" class="content" tabindex="-1"></main></div>
<main id="loading" class="loading"><h1>Loading your dashboard…</h1></main>
<dialog id="confirmDialog"><form method="dialog"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button value="cancel">Cancel</button><button id="confirmDelete" class="danger" value="confirm">Delete</button></div></form></dialog>
<dialog id="imageDialog"><form method="dialog"><h2 id="imageTitle">Hosted image URL</h2><label>Hosted image URL<input id="imageUrl" type="url" placeholder="https://example.com/image.png"></label><img id="imagePreview" alt="Image preview"><div class="actions"><button value="cancel">Cancel</button><button id="imageApply" value="apply" class="primary">Apply</button></div></form></dialog>
<dialog id="groupDialog"><form id="newGroupForm"><h2>Create group</h2><label>Name<input name="name" required maxlength="80"></label><label>Alias<input name="alias" required maxlength="24" pattern="[^\s:]+"></label><label>Avatar URL (optional)<input name="avatar" type="url" placeholder="https://example.com/group.png"></label><p id="groupCreateError" class="error-message"></p><div class="actions"><button type="button" id="cancelGroup">Cancel</button><button class="primary" type="submit">➕ Create group</button></div></form></dialog>
<dialog id="exportDialog"><form method="dialog"><h2>Export system</h2><label>Format<select id="exportFormat"><option value="plurapack">Plurapack backup</option><option value="pluralkit">PluralKit</option><option value="tupperbox">Tupperbox</option></select></label><fieldset id="exportForms" hidden><legend>Forms</legend><p>PluralKit and Tupperbox do not support Plurapack forms directly.</p><label><input type="radio" name="exportForms" value="members" checked> <strong>Export forms as standalone members</strong><small>Creates members such as “Alex — Happy” so form information is retained.</small></label><label><input type="radio" name="exportForms" value="loss"> <strong>Omit forms</strong><small>Forms will not be included in this export.</small></label></fieldset><div class="actions"><button value="cancel">Cancel</button><button id="startExport" value="export" class="primary">📤 Export</button></div></form></dialog>
<dialog id="importDialog"><form method="dialog"><h2>Import system</h2><label>JSON file<input id="importFile" type="file" accept="application/json,.json"></label><label>Format<select id="importFormat"><option value="">Auto-detect</option><option value="plurapack">Plurapack</option><option value="pluralkit">PluralKit</option><option value="tupperbox">Tupperbox</option></select></label><fieldset><legend>Conflict handling</legend><label><input type="radio" name="importStrategy" value="merge" checked> <strong>Merge</strong><small>Keep existing information and add missing/imported information.</small></label><label><input type="radio" name="importStrategy" value="skip-existing"> <strong>Skip existing</strong><small>Only create records that do not already exist.</small></label><label><input type="radio" name="importStrategy" value="overwrite"> <strong>Overwrite</strong><small>Replace matching portable records with imported data.</small></label></fieldset><div class="actions"><button value="cancel">Cancel</button><button id="startImport" value="import" class="primary">📥 Import</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><script src="dashboard_helpers.js"></script><script src="app.js"></script></body></html>
