site_name: Plurapack Documentation
site_description: Friendly setup and usage guides for the self-hosted Plurapack Stoat proxy.
docs_dir: docs
site_dir: site
strict: true
nav:
  - Welcome: index.md
  - Getting started:
      - Before you begin: getting-started/before-you-begin.md
      - Install and run: getting-started/install.md
      - First system: getting-started/first-system.md
  - Guides:
      - Proxy messages: guides/proxying.md
      - Members, aliases, and forms: guides/members-and-forms.md
      - Share a system: guides/share-a-system.md
      - Import, export, and backups: guides/import-export.md
      - Optional speech: guides/speech.md
  - Reference:
      - Commands: reference/commands.md
      - Configuration: reference/configuration.md
      - Privacy and safety: reference/privacy.md
      - Troubleshooting: reference/troubleshooting.md
extra_css:
  - stylesheets/plurapack.css
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
theme:
  name: mkdocs
  color_mode: dark
  user_color_mode_toggle: true
