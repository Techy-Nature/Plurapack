name: App builds

# Builds the Plurapack desktop installers and the Android APK from native/.
# Run it by hand from the Actions tab, or push a tag such as `app-v0.1.0`
# to also attach the files to a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
  pull_request:
    paths: ["native/**", ".github/workflows/app.yml"]

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux WebKit libraries
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: plurapack-${{ matrix.name }}
          path: |
            native/src-tauri/target/**/release/bundle/deb/*.deb
            native/src-tauri/target/**/release/bundle/rpm/*.rpm
            native/src-tauri/target/**/release/bundle/appimage/*.AppImage
            native/src-tauri/target/**/release/bundle/dmg/*.dmg
            native/src-tauri/target/**/release/bundle/msi/*.msi
            native/src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/src-tauri/target/**/release/bundle/deb/*.deb
            native/src-tauri/target/**/release/bundle/rpm/*.rpm
            native/src-tauri/target/**/release/bundle/appimage/*.AppImage
            native/src-tauri/target/**/release/bundle/dmg/*.dmg
            native/src-tauri/target/**/release/bundle/msi/*.msi
            native/src-tauri/target/**/release/bundle/nsis/*.exe

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install the Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
      - run: npm ci
      # The Android project is generated rather than committed, so it always matches the Tauri version.
      - run: npx tauri android init --ci
      - run: npx tauri android build --apk --ci
      - name: Sign the APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n 1)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          else
            # Without a saved key each build gets a new one, so Android will not
            # install it over an older build. See native/README.md to add a key.
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a throwaway key."
            ANDROID_KEYSTORE_PASSWORD=plurapack ANDROID_KEY_ALIAS=plurapack ANDROID_KEY_PASSWORD=plurapack
            keytool -genkeypair -keystore release.jks -storepass plurapack -keypass plurapack \
              -alias plurapack -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Plurapack"
          fi
          "$tools/zipalign" -p -f 4 "$apk" aligned.apk
          "$tools/apksigner" sign --ks release.jks --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass "pass:${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
            --out Plurapack.apk aligned.apk
          "$tools/apksigner" verify Plurapack.apk
          rm -f release.jks aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: plurapack-Android
          path: native/Plurapack.apk
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: native/Plurapack.apk
