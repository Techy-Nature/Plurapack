name: Tests

on:
  push:
    branches: [root]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # .[dev] brings pytest, pytest-asyncio, httpx, stoat.py and fluxer.py,
      # plus the core dashboard dependencies (fastapi, uvicorn, Pillow, ...).
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q

  javascript:
    name: Dashboard JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
