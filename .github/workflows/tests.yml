name: Tests

on:
  push:
    branches: [root]
  pull_request:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # .[dev] brings pytest, pytest-asyncio, httpx, stoat.py and fluxer.py,
      # plus the core dashboard dependencies (fastapi, uvicorn, Pillow, ...).
      - run: python -m pip install -e '.[dev]'
      - name: Run pytest
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE 2>&1 | tee pytest.log
      # List each failing test on the PR page, not only in the raw log.
      - name: Annotate failures
        if: failure()
        shell: bash
        run: |
          grep -E '^(FAILED|ERROR) ' pytest.log | cut -c1-400 | while IFS= read -r line; do
            echo "::error title=pytest::$line"
          done

  javascript:
    name: Dashboard JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
