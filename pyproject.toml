[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plurapack"
version = "0.1.0"
description = "A self-hosted Stoat member proxy with optional local speech"
requires-python = ">=3.11"
dependencies = ["stoat.py>=1.2.1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27,<1"]

[project.scripts]
plurapack = "plurapack.bot:main"
plurapack-web = "plurapack.web:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
