[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "plurapack"
version = "0.1.0"
description = "A self-hosted Stoat and Fluxer member proxy with optional local speech"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1"]

# Each chat platform is optional so operators install only what they use:
#   pip install '.[stoat]'   pip install '.[fluxer]'   pip install '.[stoat,fluxer]'
# `python install.py` asks which platforms you use and runs the right command.
[project.optional-dependencies]
stoat = ["stoat.py>=1.2.1,<2"]
fluxer = ["fluxer.py>=0.4.2,<1"]
all = ["stoat.py>=1.2.1,<2", "fluxer.py>=0.4.2,<1"]
# The test suite exercises both platforms, so `.[dev]` includes both libraries.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27,<1", "stoat.py>=1.2.1,<2", "fluxer.py>=0.4.2,<1"]

[project.scripts]
plurapack = "plurapack.bot:main"
plurapack-web = "plurapack.web:main"

# Only the plurapack package is installable. Without this, setuptools also finds
# deployment/ in a full checkout and refuses to build ("multiple top-level packages").
[tool.setuptools.packages.find]
include = ["plurapack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
