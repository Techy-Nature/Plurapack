<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Plurapack</title>
<style>body{font:16px system-ui;background:#171522;color:#f7f5ff;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#252137;padding:2rem;border-radius:1rem;max-width:34rem;text-align:center;box-shadow:0 1rem 3rem #0006}code{display:block;font-size:2rem;letter-spacing:.12em;margin:1.5rem;padding:1rem;background:#15131e;border-radius:.5rem}button{background:#8d7cf8;color:white;border:0;border-radius:.5rem;padding:.8rem 1.2rem;font-weight:700;cursor:pointer}.muted{color:#bbb4d1}.error{color:#ffaaa5}</style></head>
<body><main class="card"><h1>Sign in with Stoat</h1><p id="instructions">Generate a one-time code, then send it to the Plurapack bot from your Stoat account.</p><code id="code" hidden></code><p id="status" class="muted"></p><button id="start">Generate login code</button></main>
<script>
const button=document.querySelector('#start'),code=document.querySelector('#code'),status=document.querySelector('#status');let timer;
async function start(){clearTimeout(timer);button.disabled=true;status.className='muted';status.textContent='Generating a secure code…';try{const response=await fetch('/api/auth/login/start',{method:'POST'});if(!response.ok)throw new Error();const login=await response.json();code.hidden=false;code.textContent=login.code;document.querySelector('#instructions').textContent=`Send ${login.commandPrefix}login ${login.code} to the Plurapack bot on Stoat.`;status.textContent=`Waiting for bot verification. This code expires in ${Math.round(login.expiresIn/60)} minutes.`;poll(login);}catch{status.className='error';status.textContent='The server is unavailable. Please try again.';button.disabled=false;}}
async function poll(login){try{const response=await fetch(`/api/auth/login/${encodeURIComponent(login.attemptId)}`);if(!response.ok)throw new Error();const data=await response.json();if(data.status==='verified'){status.textContent='Verified. Finishing sign-in…';const done=await fetch(`/api/auth/login/${encodeURIComponent(login.attemptId)}/complete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({browser_secret:login.browserSecret})});if(!done.ok)throw new Error();location.assign(new URLSearchParams(location.search).get('returnTo')||'/');return;}if(data.status==='expired'){status.className='error';status.textContent='This code expired. Generate a new one.';button.disabled=false;button.textContent='Generate a new code';return;}timer=setTimeout(()=>poll(login),2000);}catch{status.className='error';status.textContent='Verification failed or the server is unavailable. Generate a new code.';button.disabled=false;button.textContent='Try again';}}
button.addEventListener('click',start);start();
</script></body></html>
