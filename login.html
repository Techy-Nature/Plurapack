<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — Plurapack</title>
<style>body{font:16px system-ui;background:#171522;color:#f7f5ff;display:grid;place-items:center;min-height:100vh;margin:0;padding:0 1rem;box-sizing:border-box}.card{background:#252137;padding:2rem;border-radius:1rem;max-width:34rem;width:100%;box-sizing:border-box;text-align:center;box-shadow:0 1rem 3rem #0006}code{display:block;font-size:2rem;letter-spacing:.12em;margin:1.5rem 0;padding:1rem;background:#15131e;border-radius:.5rem;overflow-wrap:anywhere}button{background:#8d7cf8;color:white;border:0;border-radius:.5rem;padding:.8rem 1.2rem;font-weight:700;cursor:pointer;margin:.25rem}button.secondary{background:#3a3452}button:disabled{opacity:.6;cursor:default}.muted{color:#bbb4d1}.error{color:#ffaaa5}.hint{color:#bbb4d1;font-size:.9rem}</style></head>
<body><main class="card"><h1>Sign in with Stoat or Fluxer</h1><p id="instructions">Generate a one-time code, then send it to the Plurapack bot from your Stoat or Fluxer account.</p><code id="code" hidden></code><p id="status" class="muted" role="status" aria-live="polite"></p><div><button id="copy" class="secondary" type="button" hidden>Copy command</button><button id="start" type="button">Generate login code</button></div><p id="hint" class="hint" hidden>You can switch to Stoat or Fluxer to send it. This page keeps the same code if your browser reloads it, and signs you in as soon as you come back.</p></main>
<script>
// The browser secret that finishes a login only lives in this page. Phones often
// reload a tab after the person switches to the chat app to send the code, so the
// attempt is kept in storage and resumed instead of silently replaced by a new code.
const STORAGE_KEY='plurapackLoginAttempt',POLL_MS=2000,MAX_RETRY_MS=15000;
const button=document.querySelector('#start'),copy=document.querySelector('#copy'),code=document.querySelector('#code'),status=document.querySelector('#status'),hint=document.querySelector('#hint'),instructions=document.querySelector('#instructions');
let timer,current=null,inFlight=false,failures=0,finished=false;
function saveAttempt(login){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(login))}catch{}}
function loadAttempt(){try{const login=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(login&&login.attemptId&&login.browserSecret&&login.code&&login.expiresAt>Date.now()+5000)return login}catch{}clearAttempt();return null}
function clearAttempt(){try{localStorage.removeItem(STORAGE_KEY)}catch{}}
function returnTarget(){const target=new URLSearchParams(location.search).get('returnTo')||'/';return target.startsWith('/')&&!target.startsWith('//')?target:'/'}
function remaining(login){const seconds=Math.max(0,Math.round((login.expiresAt-Date.now())/1000));return seconds>=3600&&seconds%3600===0?`${seconds/3600} hour${seconds===3600?'':'s'}`:seconds>=60?`${Math.round(seconds/60)} minute${Math.round(seconds/60)===1?'':'s'}`:'less than a minute'}
function command(login){return `${login.commandPrefix||'p;'}login ${login.code}`}
function waiting(login){status.className='muted';status.textContent=`Waiting for bot verification. This code expires in ${remaining(login)}.`}
function showAttempt(login){current=login;code.hidden=false;code.textContent=login.code;copy.hidden=false;hint.hidden=false;instructions.textContent=`Send ${command(login)} to the Plurapack bot on Stoat or Fluxer.`;button.disabled=false;button.textContent='Generate a new code';waiting(login)}
function stopWith(message){clearTimeout(timer);clearAttempt();current=null;status.className='error';status.textContent=message;copy.hidden=true;hint.hidden=true;button.disabled=false;button.textContent='Generate a new code'}
async function start(){clearTimeout(timer);clearAttempt();current=null;finished=false;failures=0;button.disabled=true;copy.hidden=true;status.className='muted';status.textContent='Generating a secure code…';try{const response=await fetch('/api/auth/login/start',{method:'POST',cache:'no-store'});if(response.status===429)throw new Error('Too many login codes were requested. Wait a minute and try again.');if(!response.ok)throw new Error('The server is unavailable. Please try again.');const data=await response.json();const login={attemptId:data.attemptId,code:data.code,browserSecret:data.browserSecret,commandPrefix:data.commandPrefix,expiresAt:Date.now()+data.expiresIn*1000};saveAttempt(login);showAttempt(login);schedule(POLL_MS)}catch(error){status.className='error';status.textContent=error.message||'The server is unavailable. Please try again.';button.disabled=false}}
function schedule(delay){clearTimeout(timer);if(current&&!finished)timer=setTimeout(poll,delay)}
async function poll(){const login=current;if(!login||finished||inFlight)return;if(login.expiresAt<=Date.now()){stopWith('This code expired. Generate a new one.');return}inFlight=true;try{const response=await fetch(`/api/auth/login/${encodeURIComponent(login.attemptId)}`,{cache:'no-store'});if(response.status===404){stopWith('This code is no longer valid. Generate a new one.');return}if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();failures=0;if(data.status==='verified'){await complete(login);return}if(data.status==='expired'){stopWith('This code expired or was already used. Generate a new one.');return}waiting(login);schedule(POLL_MS)}catch{
  // A dropped connection (common while the page is in the background) is not a
  // failed login: keep the same code and keep checking.
  failures+=1;status.className='muted';status.textContent='Connection interrupted. Still waiting with the same code…';schedule(Math.min(MAX_RETRY_MS,POLL_MS*2**Math.min(failures,3)))}finally{inFlight=false}}
async function complete(login){status.className='muted';status.textContent='Verified. Finishing sign-in…';try{const done=await fetch(`/api/auth/login/${encodeURIComponent(login.attemptId)}/complete`,{method:'POST',cache:'no-store',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({browser_secret:login.browserSecret})});if(done.status===400){stopWith('Sign-in could not be completed. Generate a new code and try again.');return}if(done.status===503){stopWith('Dashboard sign-in is not configured on this server.');return}if(!done.ok)throw new Error(`HTTP ${done.status}`);finished=true;clearAttempt();location.assign(returnTarget())}catch{failures+=1;status.className='muted';status.textContent='Verified. Reconnecting to finish sign-in…';schedule(Math.min(MAX_RETRY_MS,POLL_MS*2**Math.min(failures,3)))}}
function checkNow(){if(current&&!finished&&document.visibilityState!=='hidden'){clearTimeout(timer);poll()}}
copy.addEventListener('click',async()=>{if(!current)return;try{await navigator.clipboard.writeText(command(current));copy.textContent='Copied!'}catch{copy.textContent='Copy failed — type it instead'}setTimeout(()=>{copy.textContent='Copy command'},2000)});
button.addEventListener('click',start);
document.addEventListener('visibilitychange',checkNow);
window.addEventListener('pageshow',checkNow);
window.addEventListener('focus',checkNow);
window.addEventListener('online',checkNow);
const saved=loadAttempt();if(saved){showAttempt(saved);poll()}else start();
</script></body></html>
